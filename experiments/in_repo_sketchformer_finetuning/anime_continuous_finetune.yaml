name: anime_continuous_finetune
status: legacy
canonical_config: configs/experiment/anime_continuous_finetune.yaml

purpose:
  Legacy compatibility run for the native continuous Sketchformer model on
  anime stroke3 data. The active native objective is anime_tok_dict_finetune.

research_objective:
  sequence_goal: 1024_to_2048_stroke_steps
  attention_baseline: pytorch_sdpa_with_flash_preferred
  later_attention_experiments:
    - sparse_attention
    - local_global_attention
    - chunked_generation

launch:
  dry_run: "python scripts/sketchformer/train.py --experiment anime_continuous_finetune --dry-run"
  train: "python scripts/sketchformer/train.py --experiment anime_continuous_finetune"
  evaluate: "python scripts/sketchformer/evaluate.py --experiment anime_continuous_finetune --checkpoint weights/finetuned/sketchformer-continuous-anime/last.pt --allow-legacy-checkpoint"
  export: "python scripts/sketchformer/export.py --experiment anime_continuous_finetune --checkpoint weights/finetuned/sketchformer-continuous-anime/last.pt --output weights/finetuned/sketchformer-continuous-anime/export.pt"

expected_data:
  root: data/processed/sketchformer-ready-data/stroke3
  train: train_*.npz
  valid: valid.npz
  test: test.npz
  metadata: meta.npz

expected_artifacts:
  checkpoint_last: weights/finetuned/sketchformer-continuous-anime/last.pt
  checkpoint_best: weights/finetuned/sketchformer-continuous-anime/best.pt
  export: weights/finetuned/sketchformer-continuous-anime/export.pt

hardware_notes:
  cpu: smoke_test_only
  recommended_gpu: cuda_gpu_with_flash_attention_support
  memory_strategy:
    - batch_size_2
    - gradient_accumulation_4
    - bf16_mixed_precision
    - length_bucketing
    - gradient_checkpointing

acceptance_criteria:
  - smoke_test_passed_first
  - training_command_exits_zero
  - train_loss_decreases_or_remains_stable
  - validation_reconstruction_loss_is_finite
  - reconstruction_plots_are_generated_when_visualization_is_implemented
  - checkpoint_can_be_evaluated
  - checkpoint_can_be_exported

notes:
  - This experiment should not be judged by classification accuracy.
  - Reconstruction loss, pen accuracy, and qualitative sketches are the first signals.
  - TensorFlow pretrained-weight conversion should be validated separately before using converted weights.
